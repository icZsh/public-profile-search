    FootprintSeed:
      oneOf:
        - title: Platform identifier
          type: object
          additionalProperties: false
          required: [kind, platform, identifier_type, identifier]
          properties:
            kind:
              const: platform_identifier
            platform:
              type: string
              enum:
                - github
                - instagram
                - linkedin
                - reddit
                - tiktok
                - twitter
                - x
                - youtube
                - other
            identifier_type:
              const: handle
            identifier:
              type: string
              minLength: 1
              maxLength: 64
              description: Account handle, optionally prefixed with @; not a URL.
        - title: Bare handle
          type: object
          additionalProperties: false
          required: [kind, identifier_type, identifier]
          properties:
            kind:
              const: bare_handle
            platform:
              type: "null"
            identifier_type:
              const: handle
            identifier:
              type: string
              minLength: 1
              maxLength: 64
              description: Account handle, optionally prefixed with @; not a URL.
        - title: Profile URL
          type: object
          additionalProperties: false
          required: [kind, profile_url]
          properties:
            kind:
              const: profile_url
            profile_url:
              type: string
              format: uri
              minLength: 1
              maxLength: 300
              description: >-
                Direct HTTPS public profile URL on a supported platform. The API
                infers and returns the normalized platform and handle.
            platform:
              type: string
              enum:
                - github
                - instagram
                - linkedin
                - reddit
                - tiktok
                - twitter
                - x
                - youtube
                - other
              description: Optional client assertion; responses include the inferred platform.
            identifier_type:
              const: handle
              description: Optional client assertion; responses include handle.
            identifier:
              type: string
              minLength: 1
              maxLength: 64
              description: Optional client assertion; responses include the inferred handle.
    FootprintSeedResponse:
      oneOf:
        - title: Normalized platform identifier
          type: object
          additionalProperties: false
          required: [kind, platform, identifier_type, identifier]
          properties:
            kind:
              const: platform_identifier
            platform:
              type: string
              enum:
                - github
                - instagram
                - linkedin
                - reddit
                - tiktok
                - twitter
                - x
                - youtube
                - other
            identifier_type:
              const: handle
            identifier:
              type: string
              minLength: 1
              maxLength: 64
        - title: Normalized bare handle
          type: object
          additionalProperties: false
          required: [kind, platform, identifier_type, identifier]
          properties:
            kind:
              const: bare_handle
            platform:
              type: "null"
            identifier_type:
              const: handle
            identifier:
              type: string
              minLength: 1
              maxLength: 64
        - title: Normalized profile URL
          type: object
          additionalProperties: false
          required: [kind, profile_url, platform, identifier_type, identifier]
          properties:
            kind:
              const: profile_url
            profile_url:
              type: string
              format: uri
              minLength: 1
              maxLength: 300
            platform:
              type: string
              enum:
                - github
                - instagram
                - linkedin
                - reddit
                - tiktok
                - twitter
                - x
                - youtube
                - other
            identifier_type:
              const: handle
            identifier:
              type: string
              minLength: 1
              maxLength: 64
