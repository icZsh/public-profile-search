version: 2
errors:
  authentication_required:
    http_status: 401
    message: Authentication is required.
  unsupported_provider:
    http_status: 422
    message: Enter a direct public GitHub profile URL.
  invalid_request:
    http_status: 422
    message: The request could not be accepted.
  idempotency_conflict:
    http_status: 409
    message: This idempotency key was already used for a different request.
  anchor_candidate_not_found:
    http_status: 404
    message: The anchor candidate was not found for this discovery job.
  anchor_candidate_invalid:
    http_status: 422
    message: Only a usable exact-handle candidate can be selected as the search anchor.
  anchor_candidate_not_hypothesis:
    http_status: 422
    message: The selected account does not participate in a plausible name hypothesis.
  anchor_selection_not_required:
    http_status: 409
    message: This discovery job already has a platform anchor.
  anchor_selection_closed:
    http_status: 409
    message: This discovery job has already been finalized.
  anchor_selection_expired:
    http_status: 409
    message: The anchor selection window has closed.
  anchor_selection_unavailable:
    http_status: 409
    message: This discovery job is not waiting for an anchor selection.
  job_not_found:
    http_status: 404
    message: The job was not found.
  job_not_ready:
    http_status: 409
    message: The brief is not ready.
  result_unavailable:
    http_status: 404
    message: The result is unavailable.
  prototype_disabled:
    http_status: 503
    message: New prototype jobs are temporarily disabled.
  provider_disabled:
    http_status: 503
    message: The GitHub evaluation provider is temporarily unavailable.
  provider_rate_limited:
    http_status: 429
    message: GitHub is rate limiting profile checks. Try again later.
  verification_not_found:
    http_status: 404
    message: The verification was not found.
  verification_expired:
    http_status: 410
    message: This verification is no longer available.
  verification_unavailable:
    http_status: [404, 409, 410]
    message: The verification is unavailable.
  verification_cooldown:
    http_status: 429
    message: Wait briefly before checking the profile again.
  service_unavailable:
    http_status: 503
    message: The service is temporarily unavailable.
