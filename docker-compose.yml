services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profile_search
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile -d profile_search"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - profile-search-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  profile-search-postgres:
